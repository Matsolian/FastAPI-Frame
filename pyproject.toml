[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.3"
uvicorn = {extras = ["standart"], version = "^0.49.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
